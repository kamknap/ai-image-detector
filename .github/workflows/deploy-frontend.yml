name: Deploy frontend to Azure Static Web Apps

# Deploy on every push to main; also build PRs so broken changes are caught early.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    # Skip the deploy job when a PR is merely closed without merging.
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # provided automatically by GitHub
          action: "upload"
          # Repo root holds package.json / index.html.
          app_location: "/"
          # No backend in this repo (mock is bundled into the frontend).
          api_location: ""
          # Vite outputs the production build to /dist.
          output_location: "dist"
        env:
          # Build-time variables. Set VITE_API_URL once the real backend exists,
          # and switch VITE_USE_MOCK to "false" to use it.
          VITE_USE_MOCK: "true"
          # VITE_API_URL: "https://your-backend.azurewebsites.net"

  close_pull_request:
    # Tear down the preview environment when a PR is closed.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
