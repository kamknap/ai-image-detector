# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    # Deploy frontendu tylko przy zmianach frontendu. Zmiany w ml/ i docs/ nie
    # wplywaja na hosting — proba ponownego wydania identycznej wersji konczyla
    # sie bledem "is the current active version".
    paths-ignore:
      - "ml/**"
      - "docs/**"
      - "**.md"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_IMAGE_DETECTOR_6A4EF }}
          channelId: live
          projectId: ai-image-detector-6a4ef
